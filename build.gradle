// Root build file.
// I plugin vengono risolti tramite pluginManagement in settings.gradle.
// NON aggiungere qui blocchi allprojects { repositories { ... } }:
// settings.gradle usa FAIL_ON_PROJECT_REPOS e la build fallirebbe.
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}
