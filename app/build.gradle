plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    // Obbligatorio con AGP 8+: sostituisce l'attributo package="..." del Manifest.
    // Deve coincidere con il package dichiarato nei file .kt.
    namespace 'io.bimmergestalt.idriveconnectaddons.rallygear'
    compileSdk 34

    defaultConfig {
        applicationId "io.bimmergestalt.idriveconnectaddons.rallygear"
        minSdk 24
        targetSdk 34
        // Su GitHub Actions il numero di build (GITHUB_RUN_NUMBER) cresce a ogni esecuzione:
        // ogni APK ha un versionCode piu' alto e Android lo installa sopra il precedente.
        // In locale (senza la variabile) si usa 1.
        def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionCode buildNumber
        versionName "0.6.${buildNumber}"
    }

    // Firma: se il workflow fornisce il keystore (da GitHub Secrets) lo usa, cosi' tutte le build
    // hanno la STESSA firma e si aggiornano a vicenda. Senza keystore ripiega sulla firma debug.
    def keystorePath = System.getenv("KEYSTORE_PATH")
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

// Nessuna libreria BimmerGestalt/JitPack: la lettura dei dati CDS (CdsLiveData.kt)
// usa solo le API Android, così la build dipende soltanto da Google Maven e Maven Central.
dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
}
